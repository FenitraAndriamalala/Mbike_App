{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<h2>Confirmer la suppression de l'anomalie du {{ anomalie.date }}</h2>
<form method="post">
    {% csrf_token %}
    <p>Voulez-vous vraiment supprimer cet enregistrement ?</p>
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'anomalies_list' %}">Annuler</a>
</form>
{% endblock %}
