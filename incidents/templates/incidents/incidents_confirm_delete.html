{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<h2>Confirmer la suppression de l'incident du {{ incident.date }}</h2>
<form method="post">
    {% csrf_token %}
    <p>Voulez-vous vraiment supprimer cet incident ?</p>
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'incidents_list' %}">Annuler</a>
</form>
{% endblock %}
