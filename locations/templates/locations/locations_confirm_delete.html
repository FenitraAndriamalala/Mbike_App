{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<h2>Confirmer la suppression de la location du {{ location.date }}</h2>
<form method="post">
    {% csrf_token %}
    <p>Voulez-vous vraiment supprimer cette location ?</p>
    <button type="submit">Oui, supprimer</button>
    <a href="{% url 'locations_list' %}">Annuler</a>
</form>
{% endblock %}
