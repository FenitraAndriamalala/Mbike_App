{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<h2>Ajouter / Modifier un vélo</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

</form>
<a href="{% url 'velos_list' %}">Retour à la liste</a>
{% endblock %}
